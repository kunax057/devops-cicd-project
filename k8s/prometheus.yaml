apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "devops-demo"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - "devops-demo-service.default.svc.cluster.local:8081"
